<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404 — Page not found</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        --bg: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --accent: #0f766e;
        --on-accent: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f172a;
          --text: #f1f5f9;
          --muted: #cbd5e1;
          --accent: #2dd4bf;
          --on-accent: #0f172a;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      }
      h1 { margin: 0 0 8px; font-size: 4rem; color: var(--accent); }
      p { margin: 0 0 24px; color: var(--muted); }
      a {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 8px;
        background: var(--accent);
        color: var(--on-accent);
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>Page not found · صفحه‌ای پیدا نشد</p>
      <a href="/">Back to home · بازگشت به صفحه اصلی</a>
    </main>
  </body>
</html>
